<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Yousum</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <main class="popup">
      <h1>Yousum</h1>
      <p class="status" id="auth-status">Sign in with Google to use your backend.</p>
      <p class="status" id="status">Ready to summarize the current video.</p>
      <div class="auth-actions">
        <button id="sign-in-button">Sign in with Google</button>
        <button class="secondary" id="sign-out-button" hidden>Sign out</button>
      </div>
      <button id="summarize-button">Summarize this video</button>
      <pre id="result">No summary yet.</pre>
    </main>
    <script src="./popup.js"></script>
  </body>
</html>
